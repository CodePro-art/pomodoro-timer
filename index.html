<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <meta name="description" content="A sleek, modern Focus timer to boost your productivity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pomodoro-container">
        <header>
            <h1 class="title">Focus Timer</h1>
        </header>

        <!-- Timer Display Section -->
        <section class="timer-section" aria-live="polite">
            <div class="progress-ring-container">
                <!-- SVG Circular Progress Bar -->
                <svg class="progress-ring" viewBox="0 0 400 400">
                    <circle class="progress-ring-bg" cx="200" cy="200" r="180"></circle>
                    <circle class="progress-ring-fg" cx="200" cy="200" r="180" id="progress-circle"></circle>
                </svg>
                
                <div class="timer-display" id="time-display">25:00</div>
            </div>
        </section>
        
        <!-- Settings Section -->
        <section class="settings-section">
            <input 
                type="number" 
                id="custom-time-input" 
                class="settings-input" 
                min="1" 
                max="120" 
                value="25"
                title="Enter duration in minutes"
            >
            <span class="settings-label">min</span>
        </section>

        <!-- Controls Section -->
        <section class="controls" aria-label="Timer controls">
            <button id="play-btn" class="btn btn-icon" aria-label="Play Timer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <button id="pause-btn" class="btn btn-icon" aria-label="Pause Timer" disabled>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <button id="reset-btn" class="btn btn-icon" aria-label="Reset Timer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
