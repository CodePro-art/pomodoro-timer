<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-placeholder"></div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="sidebar-dashboard-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="nav-icon" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" id="sidebar-focus-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="nav-icon" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                    <span>Focus</span>
                </a>
                <input type="file" id="avatar-upload" accept="image/*" style="display:none">
                <a href="#" class="nav-item" id="sidebar-profile-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="nav-icon" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content area -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-bar">
                <h1 class="page-title" id="top-title">Focus View</h1>
                <div class="user-profile" id="user-profile-widget" style="cursor: pointer;">
                    <div class="avatar-container">
                        <img src="" alt="User Avatar" class="avatar-image" id="top-avatar-img" style="display: none;">
                        <div class="avatar-generic" id="top-avatar-generic">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <span class="status-dot"></span>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="top-user-name">Guest User</span>
                        <span class="user-status">Click to login...</span>
                    </div>
                </div>
            </header>

            <!-- Workspace -->
            <div class="workspace">
                
                <!-- GRID VIEW DASHBOARD (Hidden by default) -->
                <div class="grid-view hidden" id="grid-view">
                    <div class="timers-grid" id="timers-grid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- FOCUS VIEW CAROUSEL -->
                <div class="carousel-container" id="focus-view">
                    <button class="carousel-arrow left-arrow" id="prev-task-btn" aria-label="Previous Task">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>

                    <!-- Central Authentic Glass Card -->
                    <div class="pomodoro-card transitionable" id="main-focus-card">
                        <!-- Top header inside card -->
                        <div class="card-header">
                            <button class="icon-btn settings-btn" id="settings-toggle-btn" aria-label="Settings">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            </button>
                            <div class="card-title-group">
                                <input type="text" class="task-name-input" id="current-task-name" value="Pomodoro Focus" title="Edit Task Name (Multi-session)">
                                
                                <div class="front-edit-time">
                                    <label for="front-time-input">Limit: </label>
                                    <input type="number" id="front-time-input" value="25" min="1" max="120">
                                    <span>min</span>
                                </div>
                            </div>
                            <!-- Calendar Schedule Button -->
                            <button class="icon-btn calendar-btn" id="calendar-toggle-btn" aria-label="Schedule Task">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            </button>
                        </div>

                        <!-- Settings Overlay -->
                        <div class="settings-overlay hidden" id="settings-overlay">
                            <button class="close-overlay-btn" aria-label="Close">×</button>
                            <h3>Settings & Theming</h3>
                            <div class="setting-row">
                                <label>Theme:</label>
                                <select id="theme-selector">
                                    <option value="dark">Dark Space (Default)</option>
                                    <option value="light">Crisp Light</option>
                                    <option value="ocean">Ocean Breeze</option>
                                    <option value="sunset">Sunset Glow</option>
                                    <option value="slate">Slate Minimal</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Alarm Sound (via API):</label>
                                <select id="sound-selector">
                                    <option value="" disabled selected>Loading audio API...</option>
                                </select>
                                <button class="btn btn-outline preview-sound-btn" id="preview-sound-btn">▶ Test</button>
                            </div>
                            <button id="close-settings" class="btn btn-outline" style="margin-top: 15px; width: 100%;">Apply & Close</button>
                        </div>

                        <!-- Calendar Overlay -->
                        <div class="calendar-overlay hidden" id="calendar-overlay">
                            <button class="close-overlay-btn" aria-label="Close">×</button>
                            <h3>Schedule Repeating Task</h3>
                            <div class="setting-row">
                                <label>Repeat Days:</label>
                                <div class="days-selector">
                                    <button class="day-btn" data-day="0">S</button>
                                    <button class="day-btn" data-day="1">M</button>
                                    <button class="day-btn" data-day="2">T</button>
                                    <button class="day-btn" data-day="3">W</button>
                                    <button class="day-btn" data-day="4">T</button>
                                    <button class="day-btn" data-day="5">F</button>
                                    <button class="day-btn" data-day="6">S</button>
                                </div>
                            </div>
                            <div class="setting-row">
                                <label>Start Time:</label>
                                <input type="time" id="schedule-time" class="form-input">
                            </div>
                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <button id="save-calendar" class="btn btn-primary" style="flex:1;">Save</button>
                                <button id="cancel-calendar" class="btn btn-outline" style="flex:1;">Cancel</button>
                            </div>
                        </div>

                        <!-- Login Modal Overlay -->
                        <div class="login-overlay hidden" id="login-overlay">
                            <button class="close-overlay-btn" aria-label="Close">×</button>
                            <h3>Profile Setup</h3>
                            <div class="avatar-cropper-container hidden" id="avatar-cropper-container">
                                <div class="crop-circle" id="crop-circle">
                                    <img src="" id="crop-image-preview" alt="Preview">
                                </div>
                                <label>Zoom:</label>
                                <input type="range" id="crop-zoom" min="0.5" max="3" step="0.1" value="1">
                            </div>
                            <button class="btn btn-outline" id="upload-avatar-btn">Upload Image</button>

                            <label style="margin-top: 1rem;">Your Name:</label>
                            <input type="text" id="login-name-input" placeholder="e.g. Sarah K." class="form-input">
                            
                            <button id="save-login-btn" class="btn btn-primary" style="margin-top: 15px; width: 100%;">Save Profile</button>
                        </div>

                        <!-- MASSIVE X2 Circular Timer Display -->
                        <div class="timer-circle-wrap massive-timer">
                            <svg class="progress-ring-svg" viewBox="0 0 600 600">
                                <circle class="ring-track" cx="300" cy="300" r="280"></circle>
                                <circle class="ring-progress" id="progress-circle" cx="300" cy="300" r="280"></circle>
                            </svg>
                            
                            <div class="timer-center-text">
                                <div class="time-main" id="time-display">25:00</div>
                                <div class="time-sub">MINUTES REMAINING</div>
                            </div>
                        </div>

                        <!-- Action Controls -->
                        <div class="controls-row">
                            <button class="btn btn-outline" id="pause-btn" disabled>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                                <span>PAUSE</span>
                            </button>

                            <button class="btn btn-primary btn-large" id="play-btn">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                <span>PLAY</span>
                            </button>

                            <button class="btn btn-outline" id="reset-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                                <span>RESET</span>
                            </button>
                        </div>

                        <!-- Bottom tracker for the 10 tasks in the Carousel -->
                        <div class="session-tracker">
                            <span class="tracker-label">Active Task</span>
                            <div class="dots-container" id="session-dots">
                                <!-- 10 Dots representing the 10 Tasks populated by JS -->
                            </div>
                            <div class="task-indicator-label">
                                Task <span id="task-idx-label">1</span>/10
                            </div>
                        </div>
                    </div><!-- End pomodoro-card -->

                    <button class="carousel-arrow right-arrow" id="next-task-btn" aria-label="Next Task">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
