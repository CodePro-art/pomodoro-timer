<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <meta name="description" content="A sleek, modern Focus timer to boost your productivity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pomodoro-container">
        <header>
            <h1 class="title">Focus Timer</h1>
        </header>

        <!-- Timer Display Section -->
        <section class="timer-section" aria-live="polite">
            <div class="progress-ring-container">
                <!-- SVG Circular Progress Bar -->
                <svg class="progress-ring" viewBox="0 0 400 400">
                    <circle class="progress-ring-bg" cx="200" cy="200" r="180"></circle>
                    <circle class="progress-ring-fg" cx="200" cy="200" r="180" id="progress-circle"></circle>
                </svg>
                
                <div class="timer-display" id="time-display">25:00</div>
            </div>
        </section>
        
        <!-- Settings Section -->
        <section class="settings-section">
            <label for="custom-time-input" class="settings-label">Set Time (Minutes):</label>
            <input 
                type="number" 
                id="custom-time-input" 
                class="settings-input" 
                min="1" 
                max="120" 
                value="25"
                title="Enter duration in minutes"
            >
        </section>

        <!-- Controls Section -->
        <section class="controls" aria-label="Timer controls">
            <button id="start-btn" class="btn btn-primary" aria-label="Start Timer">Start</button>
            <button id="reset-btn" class="btn btn-secondary" aria-label="Reset Timer">Reset</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
